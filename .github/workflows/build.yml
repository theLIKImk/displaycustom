name: Build plugins

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor/package-lock.json

      - name: Install Node.js dependencies
        run: npm ci --prefix editor --no-audit --no-fund

      - name: Generate the shared color resource pack
        run: node scripts/build-resource-pack.mjs

      - name: Test and build the Paper plugin
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Test and build the Blockbench plugin
        run: |
          node scripts/test-blockbench-bridge.mjs
          node scripts/build-blockbench-plugin.mjs
          node --check release/display_custom_bridge.js

      - name: Upload the Paper JAR
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: paper-plugin
          path: target/display-custom-*.jar
          if-no-files-found: error

      - name: Upload the Blockbench plugin
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: blockbench-plugin
          path: |
            release/display_custom_bridge.js
            release/display-custom-blockbench-*.zip
          if-no-files-found: error
